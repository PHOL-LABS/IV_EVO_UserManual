name: CI (Spanish)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Spanish PDF and upload as an artifact
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: IV_Indicators_User_Manual_es.tex
          # latex-action v3 maps version 2025 to latest; pin the tested image.
          docker_image: ghcr.io/xu-cheng/texlive-historic-debian@sha256:d3e42adc0c8d84bc913bfc33571feaf7037616260a771bb6f027504661568bf6
      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: IV_Indicators_User_Manual_es
          path: |
            README.md
            IV_Indicators_User_Manual_es.pdf
  verify:
    name: Verify Spanish PDF/A
    runs-on: ubuntu-latest
    needs: build
    container: { image: ghcr.io/jdujava/cuni-thesis-validator }
    steps:
      - name: Get the PDF file from the artifact
        uses: actions/download-artifact@v4
      - name: Verify the PDF file with VeraPDF
        run: verify IV_Indicators_User_Manual_es/*.pdf | tee /dev/stderr | grep -qE 'nonCompliant="0" failedJobs="0"'
